# Wird ins Docker-Image kopiert (siehe Dockerfile).
# Dateiname beginnt mit zz-, damit er NACH Debians security.conf geladen wird und deren Werte überschreibt.
ServerName bestellen-lang.de
ServerTokens Prod
ServerSignature Off

# Interne PHP-Dateien sind nicht direkt aufrufbar
<Directory /var/www/html/api/lib>
    Require all denied
</Directory>
<FilesMatch "^(config|config\.local|config\.local\.example)\.php$">
    Require all denied
</FilesMatch>
# Versteckte Dateien (.git, .env …) sperren
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Strict-Transport-Security "max-age=31536000"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

# Sortiment nicht zwischenspeichern, damit Änderungen sofort sichtbar sind
<Files "shop.json">
    Header set Cache-Control "no-cache"
</Files>
